<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banana V2</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

</head>
<body>

<!-- ================= TITRE ================= -->

<h1 class="title">🍌 BANANA V2</h1>

<!-- ================= 3D BACKGROUND ================= -->

<div id="three-container"></div>

<!-- ================= INTERFACE ================= -->

<div class="container">

<select id="genre">
<option>Homme</option>
<option>Femme</option>
<option>Cyber Banana</option>
<option>Robot Banana</option>
<option>Alien Banana</option>
</select>

<select id="age"></select>
<select id="haut"></select>
<select id="bas"></select>
<select id="fond"></select>
<select id="angle"></select>

<label>
<input type="checkbox" id="autoMode">
🎲 Mode Random IA
</label>

<button onclick="generate()">🚀 GENERER PROMPT</button>

<textarea id="output" placeholder="Ton prompt apparaîtra ici..."></textarea>

</div>

<script>

/* ===============================
   MENU OPTIONS
================================*/

const hauts=["T-shirt","Hoodie","Blazer","Armor Banana","Tech Suit","Golden Jacket","Streetwear Pro"];
const bas=["Jean","Cargo","Short","Cyber Pants","Leather Pants","Neon Pants"];
const fonds=["Studio","Plage","Rooftop","Ville Nuit","Space Station","Jungle","Digital World"];
const angles=["Face","Profil","3/4","Low Angle","High Angle","Drone View"];

/* Remplir selects */

function fill(id,list){
let select=document.getElementById(id);
list.forEach(item=>{
let opt=document.createElement("option");
opt.textContent=item;
select.appendChild(opt);
});
}

fill("haut",hauts);
fill("bas",bas);
fill("fond",fonds);
fill("angle",angles);

/* Age */

let ageSelect=document.getElementById("age");
for(let i=16;i<=70;i++){
let opt=document.createElement("option");
opt.textContent=i;
ageSelect.appendChild(opt);
}

/* ===============================
   GENERATE
================================*/

async function generate(){

let data={
genre:document.getElementById("genre").value,
age:document.getElementById("age").value,
haut:document.getElementById("haut").value,
bas:document.getElementById("bas").value,
fond:document.getElementById("fond").value,
angle:document.getElementById("angle").value,
autoMode:document.getElementById("autoMode").checked
};

let res=await fetch("/generate",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});

let json=await res.json();

document.getElementById("output").value=json.prompt;
}

/* ===============================
   🌟 3D BANANES PHYSICS
================================*/

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

camera.position.z = 8;

const renderer = new THREE.WebGLRenderer({alpha:true});
renderer.setSize(window.innerWidth,window.innerHeight);
document.getElementById("three-container").appendChild(renderer.domElement);

/* Lumière */

scene.add(new THREE.AmbientLight(0xffffff,1.2));
const light = new THREE.DirectionalLight(0xffffff,2);
light.position.set(5,10,5);
scene.add(light);

/* Geometry */

const geometry = new THREE.SphereGeometry(0.7,32,32);
const material = new THREE.MeshStandardMaterial({
color:0xffd500,
roughness:0.4
});

let bananas=[];

function spawnBanana(){

const banana=new THREE.Mesh(geometry,material);

banana.position.x=(Math.random()-0.5)*10;
banana.position.y=6+Math.random()*5;
banana.position.z=(Math.random()-0.5)*5;

banana.velocity={
x:(Math.random()-0.5)*0.1,
y:-0.02-Math.random()*0.05,
z:(Math.random()-0.5)*0.1
};

scene.add(banana);
bananas.push(banana);
}

setInterval(()=>{
if(bananas.length<50){
spawnBanana();
}
},400);

/* Physics */

function updatePhysics(){

bananas.forEach(b=>{

b.velocity.y-=0.0005;

b.position.x+=b.velocity.x;
b.position.y+=b.velocity.y;
b.position.z+=b.velocity.z;

/* Collision sol */

if(b.position.y<-3){
b.position.y=-3;
b.velocity.y*=-0.6;
}

/* Walls */

if(Math.abs(b.position.x)>6){
b.velocity.x*=-1;
}

if(Math.abs(b.position.z)>4){
b.velocity.z*=-1;
}

b.rotation.x+=0.02;
b.rotation.y+=0.03;

});

}

/* Animation */

function animate(){
requestAnimationFrame(animate);
updatePhysics();
renderer.render(scene,camera);
}

animate();

/* Responsive */

window.addEventListener("resize",()=>{
camera.aspect=window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);
});

</script>

</body>
</html>
